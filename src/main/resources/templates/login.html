<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Hotel Login</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- bootstrap icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- custom css -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        body{
            background: linear-gradient(to right, #141e30, #243b55);
            height: 100vh;
        }

        .login-card{
            border: none;
            border-radius: 15px;
        }

        .hotel-title{
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .hotel-subtitle{
            color: #ddd;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-btn{
            height: 45px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container h-100">

    <div class="row justify-content-center align-items-center h-100">

        <div class="col-md-5">

            <!-- HOTEL NAME -->
            <div class="hotel-title fw-bold">
                <h5> HOUSE OF ACE </h5>
                <h4> HOTELS </h4>
            </div>

            <p class="hotel-subtitle text-muted">
                Comfort • Luxury • Excellence
            </p>

            <div class="card shadow-lg p-4 login-card">

                <!-- title -->
                <h3 class="text-center mb-4">
                    LOGIN
                </h3>

                <!-- error -->
                <div th:if="${param.error}"
                     class="alert alert-danger text-center"
                     id="errorMsg">

                    invalid credentials

                </div>

                <!-- login form -->
                <form th:action="@{/login}"
                      method="post"
                      id="loginForm">

                    <!-- email -->
                    <div class="mb-3">

                        <label class="fw-bold">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="enter email"
                               required>

                    </div>

                    <!-- password -->
                    <div class="mb-4">

                        <label class="fw-bold">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="enter password"
                               required>

                    </div>

                    <!-- button -->
                    <button type="submit"
                            class="btn btn-success w-100 login-btn"
                            id="loginBtn">

                        <span id="loginText">
                            LOGIN
                        </span>

                        <span id="loginSpinner"
                              class="spinner-border spinner-border-sm d-none">
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- auto hide alerts -->
<script>

    setTimeout(() => {

        let msg = document.getElementById("errorMsg");

        if (msg) {
            msg.style.display = "none";
        }

    }, 5000);

</script>

<!-- spinner -->
<script>

    document.getElementById("loginForm")
        .addEventListener("submit", function () {

            document.getElementById("loginBtn").disabled = true;

            document.getElementById("loginText")
                .innerText = "please wait...";

            document.getElementById("loginSpinner")
                .classList.remove("d-none");

        });

</script>

</body>
</html>
