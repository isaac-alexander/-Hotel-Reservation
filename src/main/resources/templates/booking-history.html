<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Booking History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h4>BOOKING HISTORY</h4>

    <div class="card p-3 shadow-sm table-responsive">

        <form method="get"
              th:action="@{/bookings/history/search}"
              class="mb-3">

            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Search customer name">

            <button type="submit"
                    class="btn btn-primary mt-2"
                    onclick="showSpinner(this)">

                <span class="button-text">Search</span>

                <span class="spinner-border spinner-border-sm d-none"></span>
            </button>
        </form>

        <table class="table table-hover">

            <thead class="table-dark">
            <tr>
                <th>Room</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Booking Status</th>
                <th>Payment Status</th>
                <th>Booking Code</th>
                <th>Payment Ref</th>
                <th>Total Price</th>
                <th sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
                    Customer
                </th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="b : ${bookings}">

                <td th:text="${b.roomId}"></td>

                <td th:text="${b.checkIn}"></td>

                <td th:text="${b.checkOut}"></td>

                <!-- booking status -->
                <td>

        <span th:if="${b.status == 'PENDING'}"
              class="badge bg-warning">
            PENDING
        </span>

                    <span th:if="${b.status == 'CONFIRMED'}"
                          class="badge bg-success">
            CONFIRMED
        </span>

                    <span th:if="${b.status == 'REJECTED'}"
                          class="badge bg-danger">
            REJECTED
        </span>

                    <span th:if="${b.status == 'CANCELLED'}"
                          class="badge bg-secondary">
            CANCELLED
        </span>

                    <span th:if="${b.status == 'CHECKED_IN'}"
                          class="badge bg-primary">
            CHECKED IN
        </span>

                    <span th:if="${b.status == 'CHECKED_OUT'}"
                          class="badge bg-dark">
            CHECKED OUT
        </span>

                </td>

                <!-- payment status -->
                <td>

        <span th:if="${b.paymentStatus == 'PAID'}"
              class="badge bg-success">
            PAID
        </span>

                    <span th:if="${b.paymentStatus == 'PENDING'}"
                          class="badge bg-warning text-dark">
            PENDING
        </span>

                </td>

                <td th:text="${b.bookingCode}"></td>

                <td th:text="${b.paymentReference}"></td>

                <td>
                    ₦<span th:text="${b.totalPrice}"></span>
                </td>

                <!-- customer -->
                <td sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')"
                    th:text="${b.user.name}">
                </td>

                <!-- actions -->
                <td>

                    <!-- CONFIRM -->
                    <form th:action="@{'/bookings/confirm/' + ${b.id}}"
                          method="post"
                          sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')"
                          th:if="${b.status == 'PENDING'}">

                        <button type="submit"
                                class="btn btn-success btn-sm"
                                onclick="showSpinner(this)">
                            <span class="button-text">CONFIRM</span>
                            <span class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>

                    <!-- REJECT -->
                    <form th:action="@{'/bookings/reject/' + ${b.id}}"
                          method="post"
                          sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')"
                          th:if="${b.status == 'PENDING'}">

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="showSpinner(this)">
                            <span class="button-text">REJECT</span>
                            <span class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>

                    <!-- CANCEL -->
                    <form th:action="@{'/bookings/cancel/' + ${b.id}}"
                          method="post"
                          sec:authorize="hasRole('CUSTOMER')"
                          th:if="${b.status == 'PENDING'}"
                          style="display:inline;">

                        <button type="submit"
                                class="btn btn-warning btn-sm"
                                onclick="showSpinner(this)">
                            <span class="button-text">CANCEL</span>

                            <span class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>

                    <!-- CHECK IN -->
                    <form th:action="@{'/bookings/checkin/' + ${b.id}}"
                          method="post"
                          sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')"
                          th:if="${b.status == 'CONFIRMED'}">

                        <button type="submit"
                                class="btn btn-primary btn-sm"
                                onclick="showSpinner(this)">
                            <span class="button-text">CHECK IN</span>

                            <span class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>

                    <!-- CHECK OUT -->
                    <form th:action="@{'/bookings/checkout/' + ${b.id}}"
                          method="post"
                          sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')"
                          th:if="${b.status == 'CHECKED_IN'}">

                        <button type="submit"
                                class="btn btn-warning btn-sm"
                                onclick="showSpinner(this)">

                            <span class="button-text">CHECK OUT</span>

                            <span class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>

        </table>

    </div>

</div>

<script th:src="@{/css/js/spinner.js}"></script>

</body>
</html>
