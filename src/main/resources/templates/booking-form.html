<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="card p-4 shadow-sm">

        <h4>BOOK ROOM</h4>

        <div th:if="${error}" class="alert alert-danger auto-hide">
            <span th:text="${error}"></span>
        </div>

        <div th:if="${success}" class="alert alert-success auto-hide">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/bookings/new}" th:object="${booking}" method="post">

            <input type="hidden" th:field="*{roomId}">

            <input type="date" th:field="*{checkIn}" class="form-control mb-3" required>
            <input type="date" th:field="*{checkOut}" class="form-control mb-3" required>

            <button type="submit"
                    class="btn btn-success w-100"
                    onclick="showSpinner(this)"
                    th:if="${paymentUrl == null}">

                <span class="button-text">
                    SELECT DAYS OF STAY
                </span>

                <span class="spinner-border spinner-border-sm d-none"
                      role="status">
                </span>
            </button>

            <button class="btn btn-secondary w-100"
                    th:if="${paymentUrl != null}"
                    disabled>
                BOOKED
            </button>

            <!-- payment link -->
            <div th:if="${paymentUrl}" class="mt-3">
                <a th:href="${paymentUrl}" class="btn btn-primary w-100">
                    proceed to payment
                </a>
            </div>

        </form>

    </div>

</div>
<script>

    function showSpinner(button) {

        // disable button
        button.disabled = true;

        // change text
        button.querySelector(".button-text").innerText = "Processing...";

        // show spinner
        button.querySelector(".spinner-border")
              .classList.remove("d-none");
    }

</script>

<script th:src="@{/css/js/spinner.js}"></script>

</body>
</html>
